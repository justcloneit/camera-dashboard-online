app = "camera-dashboard-change-me"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"
  PYTHONUNBUFFERED = "1"
  CAMERA_HOST = "0.0.0.0"
  CAMERA_DATA_DIR = "/data"
  CAMERA_SCAN_DIR = "/app"
  CAMERA_NO_BROWSER = "1"
  CAMERA_MAX_LIVE_STREAMS = "16"
  CAMERA_WORKERS = "auto"
  CAMERA_VALIDATION_BATCH = "300"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 25
    hard_limit = 50

[[mounts]]
  source = "camera_data"
  destination = "/data"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1

[[services.tcp_checks]]
  grace_period = "15s"
  interval = "30s"
  restart_limit = 3
  timeout = "5s"
